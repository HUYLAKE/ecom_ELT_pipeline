version: 2

models:
  - name: dim_customers
    description: "Customer dimension table"

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  

      - name: email
        data_tests:
          - not_null
          - unique


  - name: dim_products
    description: "Product dimension table"

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

     


  - name: fact_orders
    description: "Fact table containing all orders"

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: total_amount
        data_tests:
          - not_null


  - name: mart_product_performance
    description: "Product performance analysis"

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique